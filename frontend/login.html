<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login System</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<div class="login-card">


    <h1>
        WELCOME BACK
    </h1>


    <div
        id="message"
        class="message hidden"
    ></div>


    <form id="loginForm">


        <input
            type="email"
            id="email"
            placeholder="sample@email.com"
            required
        >


        <input
            type="password"
            id="password"
            placeholder="••••••"
            required
        >


        <button type="submit">
            Login
        </button>


    </form>


    <p class="register-text">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </p>


</div>


<script src="js/auth.js"></script>


</body>

</html>
